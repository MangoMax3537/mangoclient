[package]
name = "mango-auth"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["keyring"]
# OS keystore backend for the per-device key. Without it nothing can be
# persisted (accounts stay memory-only); there is no file fallback.
keyring = ["dep:keyring"]

[dependencies]
mango-net = { path = "../net" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
md-5 = "0.10"
base64 = "0.22"
chacha20poly1305 = "0.10"
zeroize = "1"
getrandom = "0.2"
url = "2"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"], optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
