[workspace]
resolver = "2"
members = ["crates/*"]
# Needs the system webkit2gtk; it has its own [workspace] and is built with
# `cargo tauri build` from src-tauri, so `cargo test --workspace` stays green.
exclude = ["src-tauri"]

[workspace.package]
version = "2.0.0-dev"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
