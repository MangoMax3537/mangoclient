[package]
name = "mango-tauri"
version = "2.0.0"
description = "MangoClient desktop shell (thin Tauri wrapper over mango-app)"
edition = "2021"
license = "MIT"
rust-version = "1.80"

# Standalone workspace: the parent workspace excludes this crate because it
# needs the system webkit2gtk (Linux) and must not break `cargo test --workspace`.
[workspace]

[lib]
name = "mango_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mangoclient"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mango-app = { path = "../crates/app" }
mango-core = { path = "../crates/core" }
mango-updater = { path = "../crates/updater" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time"] }
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
